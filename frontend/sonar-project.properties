sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# shadcn primitives are still analyzed, but banking coverage should measure our application logic.
sonar.coverage.exclusions=src/components/ui/**

sonar.sourceEncoding=UTF-8

# Uploading analysis is not enough; the PR waits for the server-side quality gate.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300