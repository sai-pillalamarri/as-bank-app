services:
  customer-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: customer_service
      POSTGRES_USER: customer_service
      POSTGRES_PASSWORD: local-only
    ports:
      - "5432:5432"
    volumes:
      - customer-postgres-data:/var/lib/postgresql/data

  mock-oauth2-server:
    image: ghcr.io/navikt/mock-oauth2-server:4.0.0
    hostname: localhost
    environment:
      JSON_CONFIG_PATH: /app/config.json
    ports:
      - "9090:8080"
    volumes:
      - ./customer-service/local/mock-oauth2/config.json:/app/config.json:ro

  account-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: account_service
      POSTGRES_USER: account_service
      POSTGRES_PASSWORD: local-only
    ports:
      - "5433:5432"
    volumes:
      - account-postgres-data:/var/lib/postgresql/data

  transaction-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: transaction_service
      POSTGRES_USER: transaction_service
      POSTGRES_PASSWORD: local-only
    ports:
      - "5434:5432"
    volumes:
      - transaction-postgres-data:/var/lib/postgresql/data

volumes:
  customer-postgres-data:
  account-postgres-data:
  transaction-postgres-data: