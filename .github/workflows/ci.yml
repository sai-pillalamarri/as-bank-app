name: CI

on:
  push:
    branches-ignore:
      - main
      - "dependabot/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed application paths
    runs-on: ubuntu-latest

    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      frontend: ${{ steps.paths.outputs.frontend }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: paths
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          if [[ "$base" =~ ^0+$ ]]; then
            base="$(git rev-list --max-parents=0 "$head")"
          fi

          files="$(git diff --name-only "$base" "$head")"

          backend=false
          frontend=false

          while IFS= read -r file; do
            case "$file" in
              customer-service/*)
                backend=true
                ;;
              frontend/*)
                frontend=true
                ;;
              sonar-project.properties|.github/workflows/*)
                backend=true
                frontend=true
                ;;
            esac
          done <<< "$files"

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

  customer-service:
    name: Customer service
    needs: changes
    if: needs.changes.outputs.backend == 'true'

    uses: ./.github/workflows/reusable-java-ci.yml

    with:
      service: customer-service
      sonar_organization: ${{ vars.SONAR_ORGANIZATION }}
      sonar_project_key: ${{ vars.SONAR_CUSTOMER_PROJECT_KEY }}

    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Sonar needs full history to map issues correctly to pull requests.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Check formatting
        working-directory: frontend
        run: npm run format:check

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Run SonarQube Cloud analysis
        if: github.event_name == 'pull_request'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: frontend
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_FRONTEND_PROJECT_KEY }}

  security-scan:
    name: Repository security scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Gitleaks needs history to detect secrets committed before the current revision.
          fetch-depth: 0

      - name: Scan filesystem with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dast:
    name: ZAP baseline
    needs: changes
    if: needs.changes.outputs.backend == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Start local dependencies
        run: docker compose up -d customer-postgres mock-oauth2-server

      - name: Wait for dependencies
        shell: bash
        run: |
          for attempt in {1..30}; do
            if docker compose exec -T customer-postgres \
              pg_isready \
              -U customer_service \
              -d customer_service >/dev/null 2>&1 &&
              curl -fsS http://127.0.0.1:9090/isalive >/dev/null 2>&1
            then
              exit 0
            fi

            sleep 2
          done

          docker compose ps
          exit 1

      - name: Start customer service
        shell: bash
        run: |
          nohup mvn \
            --batch-mode \
            -f customer-service/pom.xml \
            spring-boot:run \
            > customer-service.log 2>&1 &

          echo $! > customer-service.pid

      - name: Wait for customer service
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl -fsS \
              http://127.0.0.1:8081/actuator/health/readiness \
              >/dev/null 2>&1
            then
              exit 0
            fi

            sleep 2
          done

          cat customer-service.log
          exit 1

      - name: Run ZAP baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25
        with:
          target: "http://127.0.0.1:8080/api/v1/customers/11111111-1111-1111-1111-111111111111"
          fail_action: false
          allow_issue_writing: false
          cmd_options: "-I"
          artifact_name: zap-baseline

      - name: Apply DAST severity gate
        shell: bash
        run: |
          test -f report_json.json

          high="$(
            jq '[.site[]?.alerts[]? | select(.riskcode == "3")] | length' \
              report_json.json
          )"

          medium="$(
            jq '[.site[]?.alerts[]? | select(.riskcode == "2")] | length' \
              report_json.json
          )"

          if (( medium > 0 )); then
            echo "::warning::ZAP found $medium medium-risk alert(s)"
          fi

          if (( high > 0 )); then
            echo "::error::ZAP found $high high-risk alert(s)"
            exit 1
          fi

      - name: Stop local application
        if: always()
        shell: bash
        run: |
          if [[ -f customer-service.pid ]]; then
            kill "$(cat customer-service.pid)" 2>/dev/null || true
          fi

          docker compose down -v

  gate:
    name: ${{ github.event_name == 'pull_request' && 'PR gate' || 'Branch gate' }}
    if: always()
    needs:
      - changes
      - customer-service
      - frontend
      - security-scan
      - dast

    runs-on: ubuntu-latest

    steps:
      - name: Verify required jobs
        shell: bash
        run: |
          for result in \
            "${{ needs.changes.result }}" \
            "${{ needs.customer-service.result }}" \
            "${{ needs.frontend.result }}" \
            "${{ needs.security-scan.result }}" \
            "${{ needs.dast.result }}"
          do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              exit 1
            fi
          done