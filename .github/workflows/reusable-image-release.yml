name: Reusable image release

on:
  workflow_call:
    inputs:
      context:
        required: true
        type: string
      ecr_repository:
        required: true
        type: string
      aws_region:
        required: true
        type: string
      role_arn:
        required: true
        type: string

    outputs:
      digest:
        description: Immutable digest of the published image.
        value: ${{ jobs.release.outputs.digest }}

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: ${{ inputs.ecr_repository }}
    runs-on: ubuntu-latest

    outputs:
      digest: ${{ steps.digest.outputs.digest }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Sign in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd

      - name: Resolve image state
        id: image
        shell: bash
        run: |
          image="${{ steps.ecr.outputs.registry }}/${{ inputs.ecr_repository }}:${GITHUB_SHA}"
          echo "tag=$image" >> "$GITHUB_OUTPUT"

          set +e
          lookup="$(
            aws ecr describe-images \
              --region "${{ inputs.aws_region }}" \
              --repository-name "${{ inputs.ecr_repository }}" \
              --image-ids imageTag="${GITHUB_SHA}" \
              --query 'imageDetails[0].imageDigest' \
              --output text 2>&1
          )"
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            test -n "$lookup"
            test "$lookup" != "None"

            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "existing_digest=$lookup" >> "$GITHUB_OUTPUT"
            echo "Reusing existing image digest $lookup"
          elif grep -q "ImageNotFoundException" <<< "$lookup"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No image exists for ${GITHUB_SHA}; a new image will be built"
          else
            echo "$lookup" >&2
            exit "$status"
          fi

      - name: Set up Docker Buildx
        if: steps.image.outputs.exists != 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Build image
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: ${{ inputs.context }}
          push: false
          load: true
          tags: ${{ steps.image.outputs.tag }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.tag }}
          format: table
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Push image
        if: steps.image.outputs.exists != 'true'
        shell: bash
        run: docker push "${{ steps.image.outputs.tag }}"

      - name: Resolve immutable image digest
        id: digest
        shell: bash
        run: |
          if [ "${{ steps.image.outputs.exists }}" = "true" ]; then
            digest="${{ steps.image.outputs.existing_digest }}"
          else
            digest="$(
              aws ecr describe-images \
                --region "${{ inputs.aws_region }}" \
                --repository-name "${{ inputs.ecr_repository }}" \
                --image-ids imageTag="${GITHUB_SHA}" \
                --query 'imageDetails[0].imageDigest' \
                --output text
            )"
          fi

          test -n "$digest"
          test "$digest" != "None"

          ref="${{ steps.ecr.outputs.registry }}/${{ inputs.ecr_repository }}@${digest}"

          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Using immutable image $ref"

      - name: Generate Syft SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ${{ steps.digest.outputs.ref }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: ${{ inputs.ecr_repository }}-sbom.spdx.json
          syft-version: v1.42.3
          upload-artifact: false
          upload-release-assets: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6

      - name: Sign image
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if cosign sign \
              --yes \
              "${{ steps.digest.outputs.ref }}"; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Cosign signing failed after 3 attempts" >&2
              exit 1
            fi

            sleep $((attempt * 10))
          done

      - name: Attach signed SBOM attestation
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if cosign attest \
              --yes \
              --type spdxjson \
              --predicate sbom.spdx.json \
              "${{ steps.digest.outputs.ref }}"; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Cosign attestation failed after 3 attempts" >&2
              exit 1
            fi

            sleep $((attempt * 10))
          done

      - name: Verify image signature
        shell: bash
        run: |
          identity="^https://github.com/${GITHUB_REPOSITORY}/\\.github/workflows/.*@refs/heads/main$"

          cosign verify \
            --certificate-identity-regexp "$identity" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ steps.digest.outputs.ref }}"
