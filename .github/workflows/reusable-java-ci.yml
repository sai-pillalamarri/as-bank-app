name: Reusable Java CI

on:
  workflow_call:
    inputs:
      service:
        description: Java service directory
        required: true
        type: string
      sonar_organization:
        description: SonarQube Cloud organization key
        required: true
        type: string
      sonar_project_key:
        description: SonarQube Cloud project key
        required: true
        type: string
    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  java-ci:
    name: ${{ inputs.service }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Sonar uses Git history when assigning issues to branches and pull requests.
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        working-directory: ${{ inputs.service }}
        run: mvn --batch-mode clean verify

      - name: Run SonarQube Cloud analysis
        if: github.event_name == 'pull_request'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: ${{ inputs.service }}
          args: >
            -Dsonar.organization=${{ inputs.sonar_organization }}
            -Dsonar.projectKey=${{ inputs.sonar_project_key }}